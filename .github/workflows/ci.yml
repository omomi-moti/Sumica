name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: >
          xcodebuild test
          -project Sumica.xcodeproj
          -scheme Sumica
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -only-testing:SumicaTests
